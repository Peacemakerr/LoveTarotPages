<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Love Tarot Soulmate Support</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #241c1b;
      --muted: #6b5f5b;
      --paper: #fffaf6;
      --card: #ffffff;
      --line: #eadfd8;
      --accent: #b76755;
    }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 17px/1.65 Georgia, "Times New Roman", serif;
    }
    main {
      width: min(760px, calc(100% - 40px));
      margin: 48px auto;
      padding: 36px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(79, 47, 38, 0.08);
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(34px, 6vw, 52px);
      line-height: 1.2;
    }
    p, li {
      color: var(--muted);
    }
    a {
      color: var(--accent);
    }
    @media (max-width: 600px) {
      main {
        margin: 20px auto;
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Support</h1>
    <p>Need help with Love Tarot Soulmate? Contact us by email and include your device model, iOS version, and a short description of the issue.</p>
    <p>Email: <a href="mailto:peisu.ww@gmail.com">peisu.ww@gmail.com</a></p>
    <p>Privacy Policy: <a href="./privacy-policy.html">View privacy policy</a></p>
  </main>
</body>
</html>
